# CI for SourceTube (Forgejo Actions).
#
# Runs on UBI 10 — RHEL 10 userland, matching the AlmaLinux 10.x prod server.
# The nodejs-22 image ships Node, so there is no setup-node step, and the suite
# is node --test over plain ESM with no dependencies: nothing to install, and
# nothing to cache.
#
# The commit status Forgejo publishes is "<workflow> / <job> (<event>)", so the
# two names below are the contract that branch protection matches on — here,
# "ci / tests (pull_request)". Renaming either half silently leaves protected
# PRs waiting on a check that will never report, so treat them as permanent.
#
# runs-on must match a label the instance's runner advertises; Forgejo has no
# fixed label list. "docker" is what source.tube answers to.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests
    runs-on: docker
    container:
      image: registry.access.redhat.com/ubi10/nodejs-22
    steps:
      - uses: actions/checkout@v4

      # Fails if index.html's <noscript> block has drifted from the section
      # JSON. test/noscript.test.js asserts the same thing; this runs first so
      # the fix (npm run noscript) is the message you see, not an assertion.
      # Both generators write files that are committed. Run their --check ahead
      # of the suite so a stale file reports the command that fixes it; the
      # tests assert the same thing, but only as a failed assertion.
      - name: check the no-JS fallback is current
        run: node tools/gen-noscript.mjs --check

      - name: check llms.txt and md/ are current
        run: node tools/gen-llms.mjs --check

      - run: npm test
