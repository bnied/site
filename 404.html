<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Benjamin Nied</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/js/crt-boot.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/notfound.js" defer></script>
</head>
<body>
  <!-- Static on purpose: no modules, no boot sequence. A 404 should render in
       one paint and get out of the way. Styles come from the shared stylesheet
       because the CSP forbids inline CSS. -->
  <div id="notfound">
    <p class="nf-line"><span class="nf-prompt">visitor@bnied.dev<span class="nf-sep">:</span><span class="nf-path">~</span><span class="nf-dollar">$</span></span> cat <span class="nf-path-echo">404</span></p>
    <p class="nf-err">cat: No such file or directory</p>
    <p class="nf-hint">The page you asked for is not on this disk.</p>
    <p class="nf-hint"><a href="/">Return to the terminal</a> and type <code>help</code>.</p>
  </div>
</body>
</html>
