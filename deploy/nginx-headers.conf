# Security headers for bnied.dev.
#
# Kept in its own file because nginx's add_header does NOT merge across scopes:
# a location block that sets any header of its own discards every add_header it
# would otherwise have inherited. Since nginx-site.conf sets Cache-Control per
# location, each of those locations has to re-include this file, or the headers
# below would apply to nothing but responses that match no location at all.
#
# Install alongside nginx-site.conf:
#     /etc/nginx/snippets/bnied-headers.conf

# HTTPS only, once a browser has seen this. Deliberately a month, not a year:
# an HSTS max-age cannot be revoked within its own lifetime, so raise it only
# after confirming nothing on the domain needs plain HTTP.
add_header Strict-Transport-Security "max-age=2592000" always;

# Do not let a browser second-guess a declared Content-Type.
add_header X-Content-Type-Options "nosniff" always;

# Send the origin, not the full path, to anything a visitor clicks through to.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Nothing here needs a camera, a microphone or a location.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Content-Security-Policy. Everything is self-hosted — no CDN, no analytics, no
# external fonts — so 'self' covers the ordinary case, and the two things that
# used to require 'unsafe-inline' were refactored away: the CRT bootstrap is now
# js/crt-boot.js, and lolcat paints its hues through the CSSOM (paintRainbow in
# js/commands.js) instead of style attributes.
#
# The awkward parts are all DOOM. js-dos compiles WebAssembly, which needs
# 'wasm-unsafe-eval', and builds its emulator workers from blob: URLs. Without
# those two the site looks fine and DOOM dies at launch — so after enabling
# this, test `doom` first, not the front page.
#
# data: covers the favicons and inline SVG data URIs; blob: in img-src is for
# what the emulator draws.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
