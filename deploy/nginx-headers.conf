# Security headers for bnied.dev.
#
# Kept in its own file because nginx's add_header does NOT merge across scopes:
# a location block that sets any header of its own discards every add_header it
# would otherwise have inherited. Since nginx-site.conf sets Cache-Control per
# location, each of those locations has to re-include this file, or the headers
# below would apply to nothing but responses that match no location at all.
#
# Install alongside nginx-site.conf:
#     /etc/nginx/snippets/bnied-headers.conf

# HTTPS only, once a browser has seen this. Deliberately a month, not a year:
# an HSTS max-age cannot be revoked within its own lifetime, so raise it only
# after confirming nothing on the domain needs plain HTTP.
add_header Strict-Transport-Security "max-age=2592000" always;

# Do not let a browser second-guess a declared Content-Type.
add_header X-Content-Type-Options "nosniff" always;

# Send the origin, not the full path, to anything a visitor clicks through to.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Nothing here needs a camera, a microphone or a location.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Content-Security-Policy. Everything is self-hosted — no CDN, no analytics, no
# external fonts — so 'self' covers the ordinary case, and the two things that
# used to require 'unsafe-inline' were refactored away: the CRT bootstrap is now
# js/crt-boot.js, and lolcat paints its hues through the CSSOM (paintRainbow in
# js/commands.js) instead of style attributes.
#
# The awkward parts are all DOOM. js-dos compiles WebAssembly, which needs
# 'wasm-unsafe-eval', and runs its emulator in a Worker built from a blob: URL.
#
# blob: has to appear in script-src, not just worker-src: Safari does not honour
# worker-src and checks script-src for worker scripts, so a policy with only
# worker-src blob: passes in Chrome and refuses the emulator in Safari.
#
# 'unsafe-eval' is here because emulators.js calls eval() from bundleConfig when
# it unpacks the .jsdos bundle. Report-only mode hides this: nothing is blocked,
# so the call succeeds and never reports as the thing standing in the way. It
# only surfaced once blob: was allowed and execution got that far.
#
# This is the real cost of the easter egg. 'unsafe-eval' removes much of what
# CSP buys against injected script, for the whole site, so one visitor in a
# thousand can play DOOM. The escaping in js/render.js is what actually prevents
# injection here; CSP was defence in depth, and this weakens that layer. Note
# that 'unsafe-inline' is NOT here and should not be — it is the more valuable
# of the two restrictions and nothing needs it.
#
# The way to get the strict policy back is to move DOOM into its own document in
# an iframe and scope a looser policy to that path with a location block, so the
# main page keeps this one. That is a refactor of js/easter-eggs/doom.js, not a
# config change.
#
# data: covers the favicons and inline SVG data URIs; blob: in img-src is for
# what the emulator draws.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
