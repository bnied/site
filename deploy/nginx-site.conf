# Caching, compression and security policy for bnied.dev. Nothing in this repo
# applies it — install both snippets on the host and include this one from
# inside the server block:
#
#     cp deploy/nginx-site.conf    /etc/nginx/snippets/bnied-site.conf
#     cp deploy/nginx-headers.conf /etc/nginx/snippets/bnied-headers.conf
#
#     server {
#         server_name bnied.dev;
#         root /var/www/bnied.dev;      # must be here, not inside location /
#         include /etc/nginx/snippets/bnied-site.conf;
#     }
#
# `root` has to sit at server level: the regex locations below inherit it, and
# if it is declared inside `location /` instead they will 404 every asset.
#
# It lives in the repo so the policy is reviewable and versioned alongside the
# site it describes.

# ── protocol ──
#
# The site was serving HTTP/1.1. It loads ~45 subresources on first paint — 33
# JS modules alone — which over HTTP/1.1 serialize six at a time into roughly
# eight waves of round trips. HTTP/2 multiplexes them onto one connection.
#
# nginx 1.25.1+ takes this as its own directive; the old `listen 443 ssl http2`
# form is deprecated and silently does nothing on newer builds.
http2 on;

# ── error pages ──
#
# Without this nginx serves its stock 404: 153 bytes of white Times New Roman,
# which is a jarring way to leave a CRT terminal. 404.html is static and
# module-free so it paints in one pass.
error_page 404 /404.html;
location = /404.html {
    include /etc/nginx/snippets/bnied-headers.conf;
    add_header Cache-Control "no-cache" always;
    internal;
}

# ── compression ──
#
# Nothing was compressed at all, so every visitor pulled the text assets at full
# size: ~306K of HTML, CSS, JS and JSON on a cold load, against ~80K gzipped.
# style.css alone is 42K raw and 9.6K gzipped.
#
# woff2 is already Brotli-compressed internally and the DOOM bundle is a zip, so
# neither is listed: re-compressing them costs CPU and saves nothing. text/html
# is absent because nginx always compresses it and listing it warns on reload.
gzip on;
gzip_vary on;              # so shared caches key on Accept-Encoding
gzip_comp_level 6;         # past ~6 the returns are tiny and the CPU is not
gzip_min_length 512;       # a header-sized response is not worth a deflate pass
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/manifest+json
    text/markdown
    image/svg+xml;

# ── headers ──
#
# Included here for responses that match no location below, and again inside
# every location, because a location that sets Cache-Control drops all inherited
# add_headers. Leaving it out of a location silently unprotects everything that
# location serves — which is nearly the whole site.
include /etc/nginx/snippets/bnied-headers.conf;

# ── caching ──
#
# The problem this solves: with no Cache-Control at all, nginx sends only ETag
# and Last-Modified, and browsers fall back to *heuristic* caching — they invent
# a freshness lifetime and serve the file without asking. After a deploy that
# means a visitor can keep running the previous build's JavaScript with no
# indication anything is stale.
#
# Markup and code carry no content hash in their filenames, so a cached copy can
# never be assumed current. "no-cache" does not mean "do not store" — it means
# revalidate before use, which with the ETag already being sent is a 304 and no
# body at all.
location = / {
    include /etc/nginx/snippets/bnied-headers.conf;
    add_header Cache-Control "no-cache" always;
}

location ~* \.(?:html|js|mjs|css|json|txt|xml)$ {
    include /etc/nginx/snippets/bnied-headers.conf;
    add_header Cache-Control "no-cache" always;
}

# The markdown that llms.txt points at. nginx's mime.types has no entry for
# .md, so without this it goes out as application/octet-stream and a browser
# offers to download it instead of showing it.
location ~* \.md$ {
    include /etc/nginx/snippets/bnied-headers.conf;
    add_header Cache-Control "no-cache" always;
    default_type text/markdown;
    charset utf-8;
}

# Fonts, images and the vendored DOOM bundle are large and effectively frozen —
# they change only when deliberately replaced, which is rare enough to be worth
# a month of staleness in exchange for never re-fetching 5MB of DOS emulator.
# Shorten this if a font or an icon is ever swapped in place under the same name.
location ~* \.(?:woff2?|ttf|otf|eot|png|jpe?g|gif|svg|ico|webp|wasm|jsdos|zip)$ {
    include /etc/nginx/snippets/bnied-headers.conf;
    add_header Cache-Control "public, max-age=2592000" always;
}

# `always` on every add_header above matters: without it nginx omits the header
# on error and 304 responses, and a 304 that drops Cache-Control resets the
# client's freshness bookkeeping.
