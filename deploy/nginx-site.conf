# Caching and compression for bnied.dev. Not applied by anything in this repo —
# include it from the server block on the host, inside `server { ... }`:
#
#     include /etc/nginx/snippets/bnied-site.conf;
#
# It lives here so the policy is reviewable and versioned alongside the site it
# describes.
#
# The problem it solves: with no Cache-Control header at all, nginx sends only
# ETag and Last-Modified, and browsers fall back to *heuristic* caching — they
# invent a freshness lifetime, typically a fraction of the time since the file
# last changed, and serve the file from cache without asking. After a deploy
# that means a visitor can keep running the previous build's JavaScript with no
# indication anything is stale.

# Markup and code carry no content hash in their filenames, so a cached copy can
# never be assumed current. "no-cache" does not mean "do not store" — it means
# revalidate before use, which with the ETag already being sent is a 304 and a
# few hundred bytes. Correctness here is worth more than the round trip.
location = / {
    add_header Cache-Control "no-cache" always;
}

location ~* \.(?:html|js|mjs|css|json)$ {
    add_header Cache-Control "no-cache" always;
}

# Fonts, images and the vendored DOOM bundle are large and effectively frozen —
# they change only when deliberately replaced, which is rare enough to be worth
# a month of staleness in exchange for never re-fetching 5MB of DOS emulator.
# Shorten this if a font or an icon is ever swapped in place under the same name.
location ~* \.(?:woff2?|ttf|otf|eot|png|jpe?g|gif|svg|ico|webp|wasm|jsdos|zip)$ {
    add_header Cache-Control "public, max-age=2592000" always;
}

# `always` on each header above matters: without it nginx omits the header on
# error responses (404, 304), and a 304 that drops Cache-Control resets the
# client's freshness bookkeeping.


# ── compression ──
#
# Nothing was compressed at all, so every visitor pulled the text assets at full
# size: ~306K of HTML, CSS, JS and JSON on a cold load, against ~80K gzipped.
# The ratios are worth the CPU — style.css alone is 42K raw and 9.6K gzipped.
#
# woff2 is already Brotli-compressed internally and the DOOM bundle is a zip, so
# neither is listed below: re-compressing them costs CPU and saves nothing.
gzip on;
gzip_vary on;              # so caches key on Accept-Encoding
gzip_comp_level 6;         # past ~6 the returns are tiny and the CPU is not
gzip_min_length 512;       # a header-sized response is not worth a deflate pass
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;
# text/html is always compressed by nginx and must not be listed — doing so
# warns "duplicate MIME type" on reload.
