# The bnied.dev vhost. Install as /etc/nginx/conf.d/bnied.dev.conf.
#
# This file exists because the original was lost: nginx-site.conf was copied
# over /etc/nginx/conf.d/bnied.dev.conf instead of into /etc/nginx/snippets/,
# and no copy existed anywhere else. Keeping the vhost in the repo means the
# whole serving config is versioned, not just the policy it includes.
#
#   cp deploy/nginx-vhost.conf   /etc/nginx/conf.d/bnied.dev.conf
#   cp deploy/nginx-site.conf    /etc/nginx/snippets/bnied-site.conf
#   cp deploy/nginx-headers.conf /etc/nginx/snippets/bnied-headers.conf
#   nginx -t && systemctl reload nginx
#
# Reconstructed from two sources: what the live site was observed to do from
# outside, and the parsed config tokens recovered from the running master's heap
# with gcore + grep. nginx stores tokens rather than file text, so the
# directives below are real but their original formatting and comments are not.
#
# Recovered verbatim: server_name bnied.dev and www.bnied.dev, listen [::]:80,
# the two letsencrypt paths, access_log, try_files, root under /srv/www, and
# certbot's `if ($host = ...)` redirect.

server {
    listen 80;
    listen [::]:80;
    server_name bnied.dev www.bnied.dev;

    # The original used certbot's `if ($host = ...)` form, recovered from the
    # core. This is the same redirect written the way nginx prefers; certbot
    # will rewrite it into its own shape next time it touches this file.
    #
    # Everything on port 80 goes to the apex over TLS, including
    # /.well-known/acme-challenge/, which is what the live site did. Let's
    # Encrypt follows redirects on HTTP-01, so renewal still resolves against
    # the TLS server below. Verify with `certbot renew --dry-run` once this is
    # in place; if renewal ever used a webroot on port 80 instead, it needs a
    # `location ^~ /.well-known/acme-challenge/` above this return.
    return 301 https://bnied.dev$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # The certificate covers the apex only — www has no SAN — so www is
    # redirected on port 80 above and never terminates TLS here.
    server_name bnied.dev;

    # /srv/www was recovered from the core. It must be declared here at server
    # level, not inside a location: the regex locations in bnied-site.conf
    # inherit it, and would 404 every asset otherwise.
    root /srv/www;
    index index.html;

    # try_files was in the original. =404 rather than a fallback to index.html:
    # this is not a single-page app, and error_page 404 in bnied-site.conf
    # serves the themed page.
    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/access.log;

    # Both recovered from the core.
    ssl_certificate     /etc/letsencrypt/live/bnied.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bnied.dev/privkey.pem;

    # certbot's TLS defaults. These did not surface in the recovered tokens,
    # but /etc/letsencrypt/ssl-dhparams.pem exists on the host and certbot
    # writes the pair together, so both go back in — they carry the protocol
    # and cipher settings this server would otherwise be missing.
    #
    # nginx refuses to start if either file is absent, so `nginx -t` will say
    # so before any reload. If options-ssl-nginx.conf turns out not to exist,
    # drop that line and keep ssl_dhparam.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # HTTP/2, compression, caching, security headers, error pages.
    include /etc/nginx/snippets/bnied-site.conf;
}
