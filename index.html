<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benjamin Nied</title>
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="img/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="img/favicon-16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- CRT power-on overlay -->
  <div id="power-on"></div>

  <div id="crt">
    <div id="screen">
      <!-- Noise grain overlay -->
      <canvas id="noise" aria-hidden="true"></canvas>
      <!-- Scanline overlay -->
      <div id="scanlines" aria-hidden="true"></div>

      <div id="terminal">
        <div id="output"></div>
        <div id="input-line">
          <span class="prompt">visitor@bnied.dev<span class="prompt-sep">:</span><span class="prompt-path">~</span><span class="prompt-dollar">$</span>&nbsp;</span>
          <span id="input-wrap">
            <input type="text" id="cmd-input" autofocus autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Terminal input">
            <span id="input-sizer" aria-hidden="true"></span>
            <span class="cursor" id="cursor"></span>
          </span>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
